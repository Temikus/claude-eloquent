name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Hooks run on whatever Python the user has on PATH, so test the floor up
        # to current. macOS is here because its stock 3.9 is the reason the hooks
        # are Python at all.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install just
        uses: extractions/setup-just@v4

      - run: just check

  # Single, stable status check to require in branch protection. Passes only when
  # every matrix job succeeds (a matrix context name changes with the matrix, so
  # we aggregate into one fixed `check` context instead).
  check:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all Python versions passed"
